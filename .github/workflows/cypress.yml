name: Testes E2E - Cypress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e executar os testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports
          retention-days: 30

      - name: Debug falhas
        if: always()
        run: |
          node -e '
          const r=require("./cypress/reports/index.json");
          const walk=(s,acc)=>{(s.tests||[]).forEach(t=>t.fail&&acc.push(t));(s.suites||[]).forEach(x=>walk(x,acc));return acc};
          const f=r.results.flatMap(x=>walk(x,[]));
          f.forEach(t=>console.log("::error title="+t.fullTitle.replace(/[:,]/g," ")+"::"+String(t.err.message).replace(/\n/g," | ").slice(0,900)));
          '
